---
layout: default
---

<main class="post-container">
  <article class="box">
    <h1>// {{ page.title }}</h1>

    <p class="blog-date">
      [ {{ page.date | date: "%Y-%m-%d" }} ]
    </p>

    <div class="post-content">
      {{ content }}
    </div>

    <p>
      <a href="{{ site.baseurl }}/blog/">← Back to Blog</a>
    </p>
  </article>
</main>
