---
layout: default
title: "Voidcoder | Blog"
---

<section id="blog-archive">
    <h2><span class="prompt">guest@voidcoder:~/blog$</span> ls -lt</h2>
    <p class="subtitle">Documenting my journey, logic, and debugging.</p>
    
    <div class="blog-list">
        <ul>
            {% for post in site.posts %}
                <li style="margin-bottom: 15px;">
                    <span style="color: #888;">[{{ post.date | date: "%Y-%m-%d" }}]</span> 
                    <a href="{{ post.url }}" style="font-size: 1.1rem;">{{ post.title }}</a>
                    <br>
                    <!-- This pulls the first few lines of your markdown file as a preview -->
                    <span style="font-size: 0.9rem; color: var(--text-color);">{{ post.excerpt | strip_html | truncatewords: 20 }}</span>
                </li>
            {% endfor %}
        </ul>
    </div>
</section>
